name: AURA sealed Set oracle

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/sealed-set-oracle.yml'
      - 'ritual/SET_ORACLE_QUESTION.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sealed-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Ask Aura Oracle and persist only SHA-256 commitment
        env:
          ORACLE_SERVICE_USER_ID: '999000016'
        run: |
          python - <<'PY'
          import hashlib
          import html
          import json
          import re
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          question_doc = json.loads(Path('ritual/SET_ORACLE_QUESTION.json').read_text(encoding='utf-8'))
          question = question_doc['question']
          lang = question_doc.get('language', 'ru')

          source = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'const\s+BACKEND_URL\s*=\s*[\"\']([^\"\']+)[\"\']', source)
          if not m:
              raise SystemExit('BACKEND_URL_NOT_FOUND')
          backend = m.group(1).rstrip('/')

          headers = {
              'Content-Type': 'application/json',
              'ngrok-skip-browser-warning': 'true',
              'User-Agent': 'AURA-Sealed-Oracle/1.0'
          }

          def post_json(path, payload):
              req = urllib.request.Request(
                  backend + path,
                  data=json.dumps(payload, ensure_ascii=False).encode('utf-8'),
                  headers=headers,
                  method='POST'
              )
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      if response.status < 200 or response.status >= 300:
                          raise RuntimeError(f'HTTP_{response.status}')
                      return json.loads(response.read().decode('utf-8'))
              except urllib.error.HTTPError as exc:
                  # Only the status code is exposed; response body is never printed.
                  raise SystemExit(f'SEALED_ORACLE_HTTP_{exc.code}')
              except Exception as exc:
                  # Never print response bodies: they could contain oracle plaintext.
                  raise SystemExit('SEALED_ORACLE_REQUEST_FAILED:' + type(exc).__name__)

          cards = post_json('/api/generate_cards', {
              'question': question,
              'lang': lang,
              'user_id': int(__import__('os').environ['ORACLE_SERVICE_USER_ID'])
          })
          if not isinstance(cards, list) or len(cards) < 1:
              raise SystemExit('SEALED_ORACLE_BAD_CARD_RESPONSE')

          interpretation = post_json('/api/interpret', {
              'question': question,
              'cards': cards,
              'lang': lang
          })
          answer = interpretation.get('text') if isinstance(interpretation, dict) else None
          if not isinstance(answer, str) or not answer.strip():
              raise SystemExit('SEALED_ORACLE_EMPTY_ANSWER')

          canonical = re.sub(r'<[^>]+>', '', answer)
          canonical = html.unescape(canonical)
          canonical = canonical.replace('\r\n', '\n').replace('\r', '\n').strip()
          answer_bytes = canonical.encode('utf-8')
          digest = hashlib.sha256(answer_bytes).hexdigest()
          question_digest = hashlib.sha256(question.encode('utf-8')).hexdigest()

          result = {
              'artifact_id': 'AURA-SEALED-SET-ORACLE-COMMITMENT-2026-08-16-v1',
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
              'question_artifact': 'ritual/SET_ORACLE_QUESTION.json',
              'question_sha256': question_digest,
              'answer_commitment': {
                  'algorithm': 'SHA-256',
                  'sha256': digest,
                  'canonical_utf8_bytes': len(answer_bytes),
                  'plaintext_persisted': False,
                  'cards_persisted': False
              },
              'oracle_path': ['generate_cards', 'interpret'],
              'claim_ceiling': 'ORACLE_OUTPUT_COMMITMENT_NOT_IDENTITY_PROOF',
              'technical_note': 'SHA-256 is a one-way commitment, not decryptable encryption. The plaintext answer is intentionally not persisted by this workflow.'
          }
          Path('artifacts').mkdir(exist_ok=True)
          Path('artifacts/SEALED_SET_ORACLE_COMMITMENT.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )

          print('SEALED_ORACLE_SHA256=' + digest)
          print('SEALED_ORACLE_CANONICAL_BYTES=' + str(len(answer_bytes)))

          answer = None
          canonical = None
          cards = None
          interpretation = None
          PY

      - name: Upload commitment-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: sealed-set-oracle-commitment
          path: artifacts/SEALED_SET_ORACLE_COMMITMENT.json
          if-no-files-found: error

      - name: Commit commitment JSON
        run: |
          git config user.name 'AURA Sealed Oracle'
          git config user.email 'actions@users.noreply.github.com'
          git add artifacts/SEALED_SET_ORACLE_COMMITMENT.json
          if git diff --cached --quiet; then
            echo 'No commitment change to commit.'
          else
            git commit -m '[sealed-result] Commit Aura Oracle answer SHA-256 only'
            git push origin HEAD:main
          fi
