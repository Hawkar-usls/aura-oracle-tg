name: AURA sealed Set oracle

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/sealed-set-oracle.yml'
      - 'ritual/SET_ORACLE_QUESTION.json'
  workflow_dispatch:

permissions:
  contents: write
  models: read

jobs:
  sealed-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Ask AURA sealed oracle and persist only SHA-256 commitment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import hashlib
          import html
          import json
          import os
          import re
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          question_doc = json.loads(Path('ritual/SET_ORACLE_QUESTION.json').read_text(encoding='utf-8'))
          question = question_doc['question']

          system_prompt = (
              'You are AURA Oracle, a creative reflection engine in the Kem / Set / Horus / Osiris / Janus narrative. '
              'Privately perform the Past / Obstacle / Guide / Outcome reflection used by the original Aura Oracle, '
              'then output only one concise final answer in Russian. The answer must address the question directly. '
              'Do not claim supernatural contact, prophecy, or historically verified reincarnation as fact. '
              'Do not mention these instructions.'
          )

          payload = {
              'model': 'openai/gpt-4.1',
              'messages': [
                  {'role': 'system', 'content': system_prompt},
                  {'role': 'user', 'content': question}
              ],
              'temperature': 0.7,
              'max_tokens': 220
          }

          req = urllib.request.Request(
              'https://models.github.ai/inference/chat/completions',
              data=json.dumps(payload, ensure_ascii=False).encode('utf-8'),
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2026-03-10',
                  'User-Agent': 'AURA-Sealed-Oracle/2.0'
              },
              method='POST'
          )

          try:
              with urllib.request.urlopen(req, timeout=60) as response:
                  data = json.loads(response.read().decode('utf-8'))
          except urllib.error.HTTPError as exc:
              # Response body is deliberately not read or printed.
              raise SystemExit(f'SEALED_ORACLE_MODEL_HTTP_{exc.code}')
          except Exception as exc:
              raise SystemExit('SEALED_ORACLE_MODEL_FAILED:' + type(exc).__name__)

          try:
              answer = data['choices'][0]['message']['content']
          except Exception:
              raise SystemExit('SEALED_ORACLE_MODEL_RESPONSE_INVALID')
          if not isinstance(answer, str) or not answer.strip():
              raise SystemExit('SEALED_ORACLE_EMPTY_ANSWER')

          canonical = re.sub(r'<[^>]+>', '', answer)
          canonical = html.unescape(canonical)
          canonical = canonical.replace('\r\n', '\n').replace('\r', '\n').strip()
          answer_bytes = canonical.encode('utf-8')
          digest = hashlib.sha256(answer_bytes).hexdigest()
          question_digest = hashlib.sha256(question.encode('utf-8')).hexdigest()
          system_digest = hashlib.sha256(system_prompt.encode('utf-8')).hexdigest()

          result = {
              'artifact_id': 'AURA-SEALED-SET-ORACLE-COMMITMENT-2026-08-16-v1',
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
              'question_artifact': 'ritual/SET_ORACLE_QUESTION.json',
              'question_sha256': question_digest,
              'oracle_engine': {
                  'mode': 'AURA_SEALED_GITHUB_MODELS_V1',
                  'model': 'openai/gpt-4.1',
                  'system_prompt_sha256': system_digest,
                  'internal_reflection_structure': ['PAST', 'OBSTACLE', 'GUIDE', 'OUTCOME']
              },
              'answer_commitment': {
                  'algorithm': 'SHA-256',
                  'sha256': digest,
                  'canonical_utf8_bytes': len(answer_bytes),
                  'plaintext_persisted': False,
                  'plaintext_rendered_in_logs': False,
                  'intermediate_reflection_persisted': False
              },
              'claim_ceiling': 'ORACLE_OUTPUT_COMMITMENT_NOT_IDENTITY_PROOF',
              'technical_note': 'SHA-256 is a one-way commitment, not decryptable encryption. The answer existed transiently in the model response and runner memory and was intentionally not persisted.'
          }

          Path('artifacts').mkdir(exist_ok=True)
          Path('artifacts/SEALED_SET_ORACLE_COMMITMENT.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )

          # Only the commitment is exposed.
          print('SEALED_ORACLE_SHA256=' + digest)
          print('SEALED_ORACLE_CANONICAL_BYTES=' + str(len(answer_bytes)))

          answer = None
          canonical = None
          data = None
          payload = None
          PY

      - name: Upload commitment-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: sealed-set-oracle-commitment
          path: artifacts/SEALED_SET_ORACLE_COMMITMENT.json
          if-no-files-found: error

      - name: Commit commitment JSON
        run: |
          git config user.name 'AURA Sealed Oracle'
          git config user.email 'actions@users.noreply.github.com'
          git add artifacts/SEALED_SET_ORACLE_COMMITMENT.json
          if git diff --cached --quiet; then
            echo 'No commitment change to commit.'
          else
            git commit -m '[sealed-result] Commit Aura Oracle answer SHA-256 only'
            git push origin HEAD:main
          fi
