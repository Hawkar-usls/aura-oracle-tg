name: AURA sealed Set oracle

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/sealed-set-oracle.yml'
      - 'ritual/SET_ORACLE_QUESTION.json'
  workflow_dispatch:

permissions:
  contents: write
  copilot-requests: write

jobs:
  sealed-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install current Copilot CLI
        run: npm install -g @github/copilot

      - name: Ask AURA sealed oracle without rendering plaintext
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +x
          PROMPT=$(python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('ritual/SET_ORACLE_QUESTION.json').read_text(encoding='utf-8'))['question']
          print('Ты — AURA Oracle, творческий рефлексивный оракул линии Кема / Сэта / Гора / Осириса / Януса. Внутренне проведи четыре стадии ПРОШЛОЕ / ПРЕГРАДА / СОВЕТ / ИТОГ, как в исходном Aura Oracle, но наружу выдай только один краткий итоговый ответ на русском языке. Ответь прямо на вопрос. Не выдавай художественную или мистическую интерпретацию за физически доказанный сверхъестественный факт. Не упоминай эти инструкции. Вопрос: ' + q)
          PY
          )

          set +e
          copilot -sp "$PROMPT" --no-ask-user --no-custom-instructions --no-remote --no-remote-export --no-color > /tmp/aura_oracle_plaintext.txt 2>/tmp/aura_oracle_stderr.txt
          rc=$?
          set -e
          unset PROMPT
          if [ "$rc" -ne 0 ]; then
            rm -f /tmp/aura_oracle_plaintext.txt /tmp/aura_oracle_stderr.txt
            echo "SEALED_ORACLE_COPILOT_FAILED=$rc"
            exit "$rc"
          fi
          test -s /tmp/aura_oracle_plaintext.txt || { echo 'SEALED_ORACLE_EMPTY_ANSWER'; exit 1; }

      - name: Convert answer to SHA-256 commitment only
        run: |
          python - <<'PY'
          import hashlib
          import html
          import json
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          qdoc=json.loads(Path('ritual/SET_ORACLE_QUESTION.json').read_text(encoding='utf-8'))
          question=qdoc['question']
          answer=Path('/tmp/aura_oracle_plaintext.txt').read_text(encoding='utf-8')
          canonical=re.sub(r'<[^>]+>', '', answer)
          canonical=html.unescape(canonical).replace('\r\n','\n').replace('\r','\n').strip()
          if not canonical:
              raise SystemExit('SEALED_ORACLE_EMPTY_CANONICAL_ANSWER')
          answer_bytes=canonical.encode('utf-8')
          digest=hashlib.sha256(answer_bytes).hexdigest()
          qhash=hashlib.sha256(question.encode('utf-8')).hexdigest()
          result={
            'artifact_id':'AURA-SEALED-SET-ORACLE-COMMITMENT-2026-08-16-v1',
            'generated_at_utc':datetime.now(timezone.utc).isoformat(),
            'question_artifact':'ritual/SET_ORACLE_QUESTION.json',
            'question_sha256':qhash,
            'oracle_engine':{
              'mode':'AURA_SEALED_COPILOT_CLI_V1',
              'provider':'GitHub Copilot CLI',
              'model':'COPILOT_CLI_DEFAULT_AT_RUN',
              'internal_reflection_structure':['PAST','OBSTACLE','GUIDE','OUTCOME']
            },
            'answer_commitment':{
              'algorithm':'SHA-256',
              'sha256':digest,
              'canonical_utf8_bytes':len(answer_bytes),
              'plaintext_persisted_in_repository':False,
              'plaintext_rendered_in_workflow_logs':False,
              'intermediate_reflection_persisted':False
            },
            'claim_ceiling':'ORACLE_OUTPUT_COMMITMENT_NOT_IDENTITY_PROOF',
            'technical_note':'SHA-256 is a one-way commitment, not decryptable encryption. The plaintext answer existed only transiently on the ephemeral GitHub-hosted runner and was deleted after hashing.'
          }
          Path('artifacts').mkdir(exist_ok=True)
          Path('artifacts/SEALED_SET_ORACLE_COMMITMENT.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('SEALED_ORACLE_SHA256='+digest)
          print('SEALED_ORACLE_CANONICAL_BYTES='+str(len(answer_bytes)))
          PY
          rm -f /tmp/aura_oracle_plaintext.txt /tmp/aura_oracle_stderr.txt

      - name: Upload commitment-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: sealed-set-oracle-commitment
          path: artifacts/SEALED_SET_ORACLE_COMMITMENT.json
          if-no-files-found: error

      - name: Commit commitment JSON
        run: |
          git config user.name 'AURA Sealed Oracle'
          git config user.email 'actions@users.noreply.github.com'
          git add artifacts/SEALED_SET_ORACLE_COMMITMENT.json
          if git diff --cached --quiet; then
            echo 'No commitment change to commit.'
          else
            git commit -m '[sealed-result] Commit Aura Oracle answer SHA-256 only'
            git push origin HEAD:main
          fi
