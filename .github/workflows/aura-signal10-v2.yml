name: AURA Signal10 v2 calibrated controls

on:
  pull_request:
    paths:
      - 'tools/aura_signal10_v2.py'
      - 'tests/test_aura_signal10_v2.py'
      - 'experiments/CHRONOS-004-SIGNAL10-software-controls-r0.json'
      - 'docs/AURA_CHRONOS_004_SIGNAL10_CALIBRATION_R0.md'
      - '.github/workflows/aura-signal10-v2.yml'
  push:
    paths:
      - 'tools/aura_signal10_v2.py'
      - 'tests/test_aura_signal10_v2.py'
      - 'experiments/CHRONOS-004-SIGNAL10-software-controls-r0.json'
      - '.github/workflows/aura-signal10-v2.yml'

permissions:
  contents: read

jobs:
  software-controls-and-retained-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared AURA semantic-index dependencies
        run: python -m pip install -r requirements-aura-intelligence.txt
      - name: Compile Signal10
        run: python -m py_compile tools/aura_signal10_v2.py
      - name: Run all safety and regression tests including frozen R1
        run: python -m unittest discover -s tests -v
      - name: Reproduce conditional and negative software controls
        run: python tools/aura_signal10_v2.py controls
