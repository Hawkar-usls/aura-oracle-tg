name: AURA contextual Osiris informed pass

on:
  push:
    branches: [ main ]
    paths:
      - 'ritual/OSIRIS_FULL_EVIDENCE_PACKET.json'
      - 'tools/aura_contextual_fallback.py'
      - '.github/workflows/aura-contextual-osiris.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contextual-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run evidence-informed NAS-independent Aura pass
        run: python tools/aura_contextual_fallback.py
      - name: Upload contextual result
        uses: actions/upload-artifact@v4
        with:
          name: aura-contextual-osiris-result
          path: /tmp/aura-contextual-artifact/AURA_CONTEXTUAL_OSIRIS_RESULT.json
          if-no-files-found: error
          retention-days: 1
