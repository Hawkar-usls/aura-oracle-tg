name: AURA Rowan Hypothesis & Falsifier Bridge

on:
  workflow_dispatch:
  # Independent cloud wake paths: a delayed GitHub cron must not indefinitely
  # strand a newer canonical Rowan generation behind an old AURA packet.
  # These workflows already run on this same repository; no cross-repo token.
  workflow_run:
    workflows: ['Aura Meta Registry Runtime v2', 'JANUS Beetle Memory Receiver']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '39 * * * *'
  push:
    branches: [main]
    paths:
      - 'tools/aura_rowan_research.py'
      - '.github/workflows/aura-rowan-falsifier-bridge.yml'
  pull_request:
    paths:
      - 'tools/aura_rowan_research.py'
      - 'tests/test_aura_rowan_research.py'
      - '.github/workflows/aura-rowan-falsifier-bridge.yml'
      - 'tests/test_aura_rowan_research.py'

permissions:
  contents: write

concurrency:
  group: aura-rowan-falsifier
  cancel-in-progress: false

jobs:
  hypotheses:
    # workflow_run can report untrusted/failed events; never use those with
    # the existing contents:write permission.
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate hypothesis and epistemic firewalls
        run: python -m unittest discover -s tests -p 'test_aura_rowan_research.py'
      - name: Prepare source-bound hypotheses from Meta Registry
        if: github.event_name != 'pull_request'
        run: python tools/aura_rowan_research.py
      - name: Persist only changed source-bound proposals
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git add research/rowan/LATEST_HYPOTHESES.json
          if git diff --cached --quiet; then echo 'AURA_ROWAN=NO_NEW_SOURCE'; exit 0; fi
          git config user.name 'AURA Research Falsifier'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m '[aura] Refresh Rowan hypothesis-only falsifier packet'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
