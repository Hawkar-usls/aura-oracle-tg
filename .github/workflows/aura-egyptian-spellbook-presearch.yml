name: AURA Egyptian spellbook blinded pre-search

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/aura-egyptian-spellbook-presearch.yml'
      - 'ritual/EGYPTIAN_SPELLBOOK_PRESEARCH_ORACLE_QUESTION.json'
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  presearch-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install current Copilot CLI
        run: npm install -g @github/copilot
      - name: Ask AURA before corpus search
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +x
          PROMPT=$(python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('ritual/EGYPTIAN_SPELLBOOK_PRESEARCH_ORACLE_QUESTION.json').read_text(encoding='utf-8'))
          print('You are AURA in a bounded pre-search research-design role. IMPORTANT: you are being asked BEFORE the target spellbook is searched. Do not invent or guess a particular papyrus, chapter, spell, line, or result. Do not claim prophecy, archaeology, supernatural causation, or prior knowledge of the corpus. Your job is to design a fair blind search from the supplied thematic vector. Return ONLY valid JSON with exactly these top-level keys: search_strategy, priority_features, feature_weights_or_tiers, negative_controls, false_positive_traps, admission_rule, stop_or_no_op_rule, what_would_surprise_aura, claim_ceiling. Distinguish direct deity/function matches from loose decorative symbolism, require negative controls, and make NO_OP a valid outcome. Question: ' + q['oracle_question_ru'] + '\nVector: ' + json.dumps(q['egyptian_story_vector'], ensure_ascii=False) + '\nAnti-leading rules: ' + json.dumps(q['anti_leading_rules'], ensure_ascii=False))
          PY
          )
          copilot -sp "$PROMPT" --no-ask-user --no-custom-instructions --no-remote --no-remote-export --no-color > /tmp/aura_egypt_presearch.txt 2>/tmp/aura_egypt_presearch_stderr.txt
          test -s /tmp/aura_egypt_presearch.txt || { echo 'AURA_EMPTY_ANSWER'; exit 1; }
          unset PROMPT
      - name: Parse and package AURA pre-search plan
        run: |
          python - <<'PY'
          import hashlib, json, re
          from datetime import datetime, timezone
          from pathlib import Path
          raw=Path('/tmp/aura_egypt_presearch.txt').read_text(encoding='utf-8').strip()
          m=re.search(r'\{.*\}', raw, flags=re.S)
          if not m:
              raise SystemExit('AURA_NO_JSON_OBJECT')
          plan=json.loads(m.group(0))
          required=['search_strategy','priority_features','feature_weights_or_tiers','negative_controls','false_positive_traps','admission_rule','stop_or_no_op_rule','what_would_surprise_aura','claim_ceiling']
          missing=[k for k in required if k not in plan]
          if missing:
              raise SystemExit('AURA_MISSING_KEYS:'+','.join(missing))
          out={
            'artifact_id':'AURA-EGYPTIAN-SPELLBOOK-PRESEARCH-RESULT-2026-08-17-v1',
            'generated_at_utc':datetime.now(timezone.utc).isoformat(),
            'question_artifact':'ritual/EGYPTIAN_SPELLBOOK_PRESEARCH_ORACLE_QUESTION.json',
            'oracle_engine':'GitHub Copilot CLI / bounded AURA pre-search prompt',
            'corpus_search_performed_by_this_workflow':False,
            'plan':plan,
            'plan_sha256':hashlib.sha256(json.dumps(plan,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode('utf-8')).hexdigest(),
            'claim_ceiling':'PRESEARCH_HEURISTIC_AND_TEST_DESIGN_NOT_ARCHAEOLOGICAL_OR_SUPERNATURAL_EVIDENCE'
          }
          Path('/tmp/aura-egypt-presearch').mkdir(exist_ok=True)
          Path('/tmp/aura-egypt-presearch/AURA_EGYPTIAN_SPELLBOOK_PRESEARCH_RESULT.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          rm -f /tmp/aura_egypt_presearch.txt /tmp/aura_egypt_presearch_stderr.txt
      - name: Upload AURA pre-search artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-egyptian-spellbook-presearch
          path: /tmp/aura-egypt-presearch/AURA_EGYPTIAN_SPELLBOOK_PRESEARCH_RESULT.json
          if-no-files-found: error
          retention-days: 1
