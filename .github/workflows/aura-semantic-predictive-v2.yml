name: Aura Semantic Predictive Spiral v2

on:
  push:
    paths:
      - 'contracts/AURA_ORACLE_SEMANTIC_PREDICTIVE_SPIRAL_V2.json'
      - 'requirements-aura-intelligence.txt'
      - 'tools/aura_semantic_predictive_core_v2.py'
      - 'tools/aura_predictive_input_v2.py'
      - 'tools/aura_5d_spiral_v2.py'
      - 'tools/aura_habitat_spiral_peer_v2.py'
      - 'tools/aura_registry_watch_v2.py'
      - 'tools/aura_intelligence_http_v2.py'
      - 'tests/test_aura_semantic_predictive_spiral_v2.py'
      - 'tests/test_aura_predictive_input_v2.py'
      - 'tests/test_aura_bom_ingest_v2.py'
      - '.github/workflows/aura-semantic-predictive-v2.yml'
  pull_request:
    paths:
      - 'contracts/AURA_ORACLE_SEMANTIC_PREDICTIVE_SPIRAL_V2.json'
      - 'requirements-aura-intelligence.txt'
      - 'tools/aura_semantic_predictive_core_v2.py'
      - 'tools/aura_predictive_input_v2.py'
      - 'tools/aura_5d_spiral_v2.py'
      - 'tools/aura_habitat_spiral_peer_v2.py'
      - 'tools/aura_registry_watch_v2.py'
      - 'tools/aura_intelligence_http_v2.py'
      - 'tests/test_aura_semantic_predictive_spiral_v2.py'
      - 'tests/test_aura_predictive_input_v2.py'
      - 'tests/test_aura_bom_ingest_v2.py'
      - '.github/workflows/aura-semantic-predictive-v2.yml'

permissions:
  contents: read

jobs:
  aura-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install streaming JSON dependency
        run: python -m pip install -r requirements-aura-intelligence.txt
      - name: Compile Aura v2 engines
        run: >-
          python -m py_compile
          tools/aura_semantic_predictive_core_v2.py
          tools/aura_predictive_input_v2.py
          tools/aura_5d_spiral_v2.py
          tools/aura_habitat_spiral_peer_v2.py
          tools/aura_registry_watch_v2.py
          tools/aura_intelligence_http_v2.py
      - name: Validate frozen contract
        run: python -m json.tool contracts/AURA_ORACLE_SEMANTIC_PREDICTIVE_SPIRAL_V2.json > /dev/null
      - name: Run semantic predictive spiral tests
        run: >-
          python -m unittest -v
          tests/test_aura_semantic_predictive_spiral_v2.py
          tests/test_aura_predictive_input_v2.py
          tests/test_aura_bom_ingest_v2.py
