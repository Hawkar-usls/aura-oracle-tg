name: AURA backend Osiris location blind query

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/aura-backend-osiris-location.yml'
      - 'ritual/OSIRIS_LOCATION_BLIND_QUESTION.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query-aura-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Query the actual Aura backend without logging plaintext
        run: |
          python - <<'PY'
          import json, re, urllib.request, urllib.error, hashlib
          from datetime import datetime, timezone
          from pathlib import Path

          html = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'const\s+BACKEND_URL\s*=\s*"([^"]+)"', html)
          if not m:
              raise SystemExit('BACKEND_URL_NOT_FOUND')
          backend = m.group(1).rstrip('/')

          qdoc = json.loads(Path('ritual/OSIRIS_LOCATION_BLIND_QUESTION.json').read_text(encoding='utf-8'))
          question = qdoc['question']
          headers = {
              'Content-Type': 'application/json',
              'ngrok-skip-browser-warning': 'true',
              'User-Agent': 'AURA-OneShot-Research/1.1'
          }

          def request_raw(url, method='GET', body=None):
              data = None if body is None else json.dumps(body, ensure_ascii=False).encode('utf-8')
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      return r.status, r.read().decode('utf-8', errors='replace')
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode('utf-8', errors='replace')
              except Exception as e:
                  return 0, type(e).__name__

          discovered = []
          status, raw = request_raw(f'{backend}/openapi.json')
          if status == 200:
              try:
                  spec = json.loads(raw)
                  discovered = sorted((spec.get('paths') or {}).keys())
              except Exception:
                  pass

          gen_candidates = [p for p in discovered if 'generate' in p.lower() and 'card' in p.lower()]
          gen_candidates += ['/api/generate_cards','/generate_cards','/aura/api/generate_cards','/aura/generate_cards']
          gen_candidates = list(dict.fromkeys(gen_candidates))

          raw_cards = None
          chosen_generate = None
          generate_statuses = {}
          for p in gen_candidates:
              st, txt = request_raw(
                  backend+p,
                  method='POST',
                  body={'question': question, 'lang': 'ru', 'user_id': 0}
              )
              generate_statuses[p] = st
              if st == 200:
                  try:
                      candidate = json.loads(txt)
                  except Exception:
                      candidate = None
                  if isinstance(candidate, list) and candidate:
                      raw_cards = candidate
                      chosen_generate = p
                      break

          if raw_cards is None:
              summary = ','.join(f'{k}:{v}' for k,v in generate_statuses.items())
              raise SystemExit('AURA_GENERATE_ROUTE_NOT_FOUND_OR_FAILED:'+summary)

          roles = ['ПРОШЛОЕ','ПРЕГРАДА','СОВЕТ','ИТОГ']
          cards = []
          for i,c in enumerate(raw_cards[:4]):
              if not isinstance(c, dict):
                  continue
              cards.append({
                  'id': i+2,
                  'label': str(c.get('text','')).strip(),
                  'emoji': str(c.get('emoji','')),
                  'role': roles[i] if i < len(roles) else 'КАРТА'
              })
          if not cards:
              raise SystemExit('AURA_BACKEND_EMPTY_CARDS')

          interpret_candidates = [p for p in discovered if 'interpret' in p.lower()]
          interpret_candidates += ['/api/interpret','/interpret','/aura/api/interpret','/aura/interpret']
          interpret_candidates = list(dict.fromkeys(interpret_candidates))

          interpretation = None
          chosen_interpret = None
          interpret_statuses = {}
          for p in interpret_candidates:
              st, txt = request_raw(
                  backend+p,
                  method='POST',
                  body={'question': question, 'cards': cards, 'lang': 'ru'}
              )
              interpret_statuses[p] = st
              if st == 200:
                  try:
                      candidate = json.loads(txt)
                  except Exception:
                      candidate = None
                  if isinstance(candidate, dict) and str(candidate.get('text','')).strip():
                      interpretation = candidate
                      chosen_interpret = p
                      break

          if interpretation is None:
              summary = ','.join(f'{k}:{v}' for k,v in interpret_statuses.items())
              raise SystemExit('AURA_INTERPRET_ROUTE_NOT_FOUND_OR_FAILED:'+summary)

          answer = re.sub(r'<[^>]+>', '', str(interpretation.get('text',''))).strip()
          if not answer:
              raise SystemExit('AURA_BACKEND_EMPTY_INTERPRETATION')

          out = {
              'artifact_id':'AURA-BACKEND-OSIRIS-LOCATION-BLIND-RESULT-2026-08-16-v2',
              'generated_at_utc':datetime.now(timezone.utc).isoformat(),
              'backend_from_current_frontend':backend,
              'question_artifact':'ritual/OSIRIS_LOCATION_BLIND_QUESTION.json',
              'discovered_openapi_paths':discovered,
              'generate_route':chosen_generate,
              'interpret_route':chosen_interpret,
              'cards':cards,
              'answer':answer,
              'answer_sha256':hashlib.sha256(answer.encode('utf-8')).hexdigest(),
              'claim_ceiling':'AURA_OUTPUT_IS_SYMBOLIC_REFLECTION_NOT_PHYSICAL_LOCATION_EVIDENCE'
          }
          Path('/tmp/aura-backend-artifact').mkdir(exist_ok=True)
          Path('/tmp/aura-backend-artifact/AURA_BACKEND_OSIRIS_LOCATION_RESULT.json').write_text(
              json.dumps(out, ensure_ascii=False, indent=2)+'\n', encoding='utf-8'
          )
          print('AURA_BACKEND_QUERY_OK')
          PY

      - name: Upload Aura backend result artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-backend-osiris-location-result
          path: /tmp/aura-backend-artifact/AURA_BACKEND_OSIRIS_LOCATION_RESULT.json
          if-no-files-found: error
          retention-days: 1
